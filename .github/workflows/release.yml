name: Publicar versão

# Antes de rodar: suba a versão em app/package.json e app/src-tauri/tauri.conf.json.
# Segredos necessários no repositório:
#   TAURI_SIGNING_PRIVATE_KEY           -> conteúdo do arquivo updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  -> senha da chave (vazio se gerada sem senha)
# Segredo opcional (recomendado):
#   VIRUSTOTAL_API_KEY                  -> chave da API do VirusTotal (plano
#        gratuito serve). Com ela, o instalador é ENVIADO ao VirusTotal durante
#        o release, então o link nas notas (gui/file/<sha256>) passa a existir.
#        Sem a chave, esse link pode aparecer como "não encontrado" até que
#        alguém envie o arquivo manualmente em virustotal.com.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Notas da versão (aparecem no update e no release)"
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: app

      - name: Build, assinatura e publicação
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "Rz GameBooster v__VERSION__"
          releaseBody: ${{ github.event.inputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Anexar SHA256 e VirusTotal às notas
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          $ver = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$ver"
          $exe = Get-ChildItem -Recurse app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "instalador não encontrado; nada a anexar"; exit 0 }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $vtUrl = "https://www.virustotal.com/gui/file/$hash"

          # Envia o instalador ao VirusTotal para que a página do hash exista.
          # Sem isso, um arquivo novo aparece como "não encontrado" no link.
          if ($env:VIRUSTOTAL_API_KEY) {
            try {
              $headers = @{ "x-apikey" = $env:VIRUSTOTAL_API_KEY }
              if ((Get-Item $exe.FullName).Length -lt 32MB) {
                $endpoint = "https://www.virustotal.com/api/v3/files"
              } else {
                # Arquivos acima de 32 MB exigem uma URL de upload dedicada.
                $endpoint = (Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers).data
              }
              Invoke-RestMethod -Uri $endpoint -Method Post -Headers $headers -Form @{ file = Get-Item $exe.FullName } | Out-Null
              Write-Host "instalador enviado ao VirusTotal"
              $vtLine = "VirusTotal: $vtUrl (a análise pode levar alguns minutos para aparecer)"
            } catch {
              Write-Host "falha ao enviar ao VirusTotal: $($_.Exception.Message)"
              $vtLine = "VirusTotal: $vtUrl"
            }
          } else {
            $vtLine = "VirusTotal: $vtUrl (se a página não existir, envie o instalador em virustotal.com)"
          }

          $body = "$env:NOTES`n`n---`nSHA256 ($($exe.Name)): ``$hash```n$vtLine"
          gh release edit $tag --notes "$body"
